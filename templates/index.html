<!DOCTYPE html>
<html>
<head>
<title>Fake News Detection</title>
<style>
body{font-family:Arial;text-align:center;background:#f2f2f2;padding:30px}
.box{background:white;padding:30px;border-radius:15px;max-width:600px;margin:auto;box-shadow:0 0 15px gray}
textarea{width:90%;height:120px;padding:10px;border-radius:5px}
button{padding:12px 25px;background:#007bff;color:white;border:none;border-radius:8px;margin-top:15px;cursor:pointer;font-size:16px}
.result{margin-top:20px;font-size:22px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h2>📰 Fake News Detector</h2>
<form method="POST">
<textarea name="news" placeholder="Paste news here to check..."></textarea><br>
<button type="submit">Check Now</button>
</form>
{% if prediction %}
<div class="result" style="color:{% if prediction=='Fake' %}red{% else %}green{% endif %}">
Result: {{prediction}}
</div>
{% endif %}
</div>
</body>
</html>
