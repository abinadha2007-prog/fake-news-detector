<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>
    <style>
        body { font-family: Arial; background: #f0f2f5; text-align: center; padding: 30px; }
        .box { background: white; max-width: 600px; margin: auto; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        textarea { width: 95%; height: 120px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; margin-top: 15px; font-size: 16px; }
        .result { margin-top: 20px; padding: 15px; border-radius: 10px; font-size: 20px; font-weight: bold; }
        .fake { background: #ffdddd; color: #d8000c; border: 1px solid #d8000c; }
        .real { background: #ddffdd; color: #270; border: 1px solid #270; }
    </style>
</head>
<body>
    <div class="box">
        <h2>📰 Fake News Detector</h2>
        <form method="POST">
            <textarea name="news" placeholder="Inga news ah paste pannu da machi...">{{ news_text }}</textarea><br>
            <button type="submit">Check News </button>
        </form>

        {% if result %}
            <div class="result {% if 'FAKE' in result %}fake{% else %}real{% endif %}">
                {{ result }} <br>
                {% if confidence %}
                <small>Confidence: {{ confidence }}%</small>
                {% endif %}
            </div>
        {% endif %}
    </div>
</body>
</html>
